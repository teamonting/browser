<!doctype html>
<html lang="en">
  <head>
    <script type="importmap">
      {
        "imports": {
          "@onting/browser": "http://localhost:5002/index.js",
          "@onting/stub": "https://cdn.jsdelivr.net/npm/@onting/stub@main/dist/index.js"
        }
      }
    </script>
    <style type="text/css">
      body {
        background-color: #f7f7f7;
      }
    </style>
  </head>
  <body>
    <button data-testid="click-me" type="button">Click me</button>
    <label>
      Type on me:&nbsp;
      <input type="text" data-testid="type-on-me" />
    </label>
    <iframe src="iframe.html"></iframe>
    <script type="module">
      document.querySelector('[data-testid="click-me"]').addEventListener('click', ({ currentTarget }) => {
        currentTarget.textContent = 'Clicked';
        currentTarget.style.backgroundColor = 'red';
        currentTarget.style.borderColor = 'white';
        currentTarget.style.color = 'white';
      });
    </script>
    <script type="module">
      import { createExpectMatcher, getStub } from '@onting/browser';
      import stubDeclaration from '@onting/stub';
      import expect from 'https://esm.sh/expect?standalone';

      const stub = await getStub(stubDeclaration);

      // TODO: Should move `createExpectMatcher` to `@onting/stub`.
      expect.extend(createExpectMatcher(stub));

      // Set viewport
      await stub.setViewport(640, 480);

      // Print timestamp
      const timestamp = await stub.getTimestamp();

      const headingElement = document.createElement('h1');

      headingElement.textContent = timestamp;

      document.body.appendChild(headingElement);

      // Capture screenshot
      // console.log(await stub.captureScreenshot());

      await stub.click(document.querySelector('[data-testid="click-me"]'));
      await stub.click(document.querySelector('[data-testid="type-on-me"]'));

      await stub.type('Hello, World!', { selectAllBeforeType: true });
      await stub.type('Aloha!', { selectAllBeforeType: true });

      await expect(stub.captureScreenshot()).resolves.toMatchImageSnapshot();

      console.log('🆗');
    </script>
  </body>
</html>
