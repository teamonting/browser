<!doctype html>
<html lang="en">
  <head>
    <script type="importmap">
      {
        "imports": {
          "@onting/browser@main": "https://cdn.jsdelivr.net/npm/@onting/browser@main/static/index.js",
          "@onting/browser@local": "http://localhost:5002/index.js",
          "@onting/stub@local": "http://localhost:5001/index.js",
          "@onting/stub@local/": "http://localhost:5001/",
          "@onting/stub@main": "https://cdn.jsdelivr.net/npm/@onting/stub@main/dist/index.js",
          "@onting/stub@main/": "https://cdn.jsdelivr.net/npm/@onting/stub@main/dist/",
          "expect": "https://esm.sh/expect?standalone"
        }
      }
    </script>
    <style type="text/css">
      body {
        background-color: #f7f7f7;
      }
    </style>
  </head>
  <body>
    <button data-testid="click-me" type="button">Click me</button>
    <label>
      Type on me:&nbsp;
      <input type="text" data-testid="type-on-me" />
    </label>
    <!-- <iframe src="iframe.html"></iframe> -->
    <script type="module">
      document.querySelector('[data-testid="click-me"]').addEventListener('click', ({ currentTarget }) => {
        currentTarget.textContent = 'Clicked';
        currentTarget.style.backgroundColor = 'red';
        currentTarget.style.borderColor = 'white';
        currentTarget.style.color = 'white';
      });
    </script>
    <script type="module">
      import { getStub } from '@onting/browser@main';
      import stubDeclaration from '@onting/stub@main';
      import { createExpectMatcher } from '@onting/stub@main/expectMatcher.js';
      import expect from 'expect';

      const stub = await getStub(stubDeclaration);

      // TODO: Should move `createExpectMatcher` to `@onting/stub`.
      expect.extend(createExpectMatcher(stub));

      // Set viewport
      await stub.setViewport(640, 480);

      // Print version
      const version = await stub.getVersion();

      const headingElement = document.createElement('h1');

      headingElement.textContent = version;

      document.body.appendChild(headingElement);

      await stub.EXPERIMENTAL_click(document.querySelector('[data-testid="click-me"]'));
      await stub.EXPERIMENTAL_click(document.querySelector('[data-testid="type-on-me"]'));

      await stub.EXPERIMENTAL_type('Hello, World!', { selectAllBeforeType: true });
      await stub.EXPERIMENTAL_type('Aloha!', { selectAllBeforeType: true });

      await expect(stub.captureScreenshot()).resolves.toMatchImageSnapshot();

      console.log('🆗');
    </script>
  </body>
</html>
